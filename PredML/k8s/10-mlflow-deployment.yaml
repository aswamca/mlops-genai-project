# MLflow tracking/registry server using the image built by docker/.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: predml
  labels:
    app.kubernetes.io/name: mlflow
    app.kubernetes.io/part-of: predml
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mlflow
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mlflow
        app.kubernetes.io/part-of: predml
    spec:
      containers:
        - name: mlflow
          image: predml-local/mlflow:latest
          # Uses the image already built locally; no registry pull is required.
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          volumeMounts:
            - name: mlruns
              mountPath: /app/PredML/mlruns
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
      volumes:
        - name: mlruns
          persistentVolumeClaim:
            claimName: predml-mlruns-pvc
