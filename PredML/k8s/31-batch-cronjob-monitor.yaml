# Daily drift monitoring. Requires a baseline and recent batch predictions.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: predml-monitor
  namespace: predml
  labels:
    app.kubernetes.io/name: predml-batch
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: predml
spec:
  schedule: "0 6 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: predml-batch
        app.kubernetes.io/component: monitoring
        app.kubernetes.io/part-of: predml
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: predml-batch
            app.kubernetes.io/component: monitoring
            app.kubernetes.io/part-of: predml
        spec:
          restartPolicy: Never
          containers:
            - name: monitor
              image: predml-local/batch:latest
              imagePullPolicy: IfNotPresent
              envFrom:
                - configMapRef:
                    name: predml-config
              env:
                - name: STAGE
                  value: "08_model_monitoring"
              args:
                - monitor
              volumeMounts:
                - name: data
                  mountPath: /app/PredML/data
                - name: mlruns
                  mountPath: /app/PredML/mlruns
                - name: model
                  mountPath: /app/PredML/model
                - name: predictions
                  mountPath: /app/PredML/predictions
                - name: monitoring
                  mountPath: /app/PredML/monitoring
              resources:
                requests:
                  cpu: 250m
                  memory: 512Mi
                limits:
                  cpu: "1"
                  memory: 2Gi
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: predml-data-pvc
            - name: mlruns
              persistentVolumeClaim:
                claimName: predml-mlruns-pvc
            - name: model
              persistentVolumeClaim:
                claimName: predml-model-pvc
            - name: predictions
              persistentVolumeClaim:
                claimName: predml-predictions-pvc
            - name: monitoring
              persistentVolumeClaim:
                claimName: predml-monitoring-pvc
