# One-shot training job. Set STAGE to another supported batch script when
# creating a separate job; 00_generate_raw_data is intentionally not included.
apiVersion: batch/v1
kind: Job
metadata:
  name: predml-batch-train
  namespace: predml
  labels:
    app.kubernetes.io/name: predml-batch
    app.kubernetes.io/component: training
    app.kubernetes.io/part-of: predml
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 7200
  template:
    metadata:
      labels:
        app.kubernetes.io/name: predml-batch
        app.kubernetes.io/component: training
        app.kubernetes.io/part-of: predml
    spec:
      restartPolicy: Never
      containers:
        - name: batch
          image: predml-local/batch:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: predml-config
          env:
            # Training expects the offline feature store to already exist.
            - name: STAGE
              value: "04_train_model"
          volumeMounts:
            - name: data
              mountPath: /app/PredML/data
            - name: mlruns
              mountPath: /app/PredML/mlruns
            - name: model
              mountPath: /app/PredML/model
            - name: predictions
              mountPath: /app/PredML/predictions
            - name: monitoring
              mountPath: /app/PredML/monitoring
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: predml-data-pvc
        - name: mlruns
          persistentVolumeClaim:
            claimName: predml-mlruns-pvc
        - name: model
          persistentVolumeClaim:
            claimName: predml-model-pvc
        - name: predictions
          persistentVolumeClaim:
            claimName: predml-predictions-pvc
        - name: monitoring
          persistentVolumeClaim:
            claimName: predml-monitoring-pvc
