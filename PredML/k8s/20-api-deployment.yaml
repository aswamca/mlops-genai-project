# FastAPI inference service using the image built by docker/.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: predml-api
  namespace: predml
  labels:
    app.kubernetes.io/name: predml-api
    app.kubernetes.io/part-of: predml
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: predml-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: predml-api
        app.kubernetes.io/part-of: predml
    spec:
      containers:
        - name: api
          image: predml-local/api:latest
          # Uses the image already built locally; no registry pull is required.
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: predml-config
          volumeMounts:
            - name: data
              mountPath: /app/PredML/data
            - name: mlruns
              mountPath: /app/PredML/mlruns
            - name: model
              mountPath: /app/PredML/model
            - name: predictions
              mountPath: /app/PredML/predictions
            - name: monitoring
              mountPath: /app/PredML/monitoring
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: predml-data-pvc
        - name: mlruns
          persistentVolumeClaim:
            claimName: predml-mlruns-pvc
        - name: model
          persistentVolumeClaim:
            claimName: predml-model-pvc
        - name: predictions
          persistentVolumeClaim:
            claimName: predml-predictions-pvc
        - name: monitoring
          persistentVolumeClaim:
            claimName: predml-monitoring-pvc
