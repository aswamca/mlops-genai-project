# Optional autoscaling policy. Requires Metrics Server and container requests.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: predml-api
  namespace: predml
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: predml-api
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
