# In-cluster API endpoint. Use kubectl port-forward for local access.
apiVersion: v1
kind: Service
metadata:
  name: predml-api
  namespace: predml
  labels:
    app.kubernetes.io/name: predml-api
    app.kubernetes.io/part-of: predml
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: predml-api
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
